<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gritos.com</title>

    <!-- Social / SEO metadata, restored from the deployed shell. This is a
         single-page app, so crawlers only ever see these static tags — the
         router never rewrites them (legacy didn't either). -->
    <meta property="og:title" content="Gritos.com" />
    <meta
      property="og:image"
      content="https://gritos.com/assets/logogritos.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://gritos.com/assets/logogritos.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url" content="https://gritos.com" />
    <meta property="fb:app_id" content="472185159492660" />
    <meta
      property="og:description"
      content="Expresa libremente y sin ningún tipo de tapujos tu opinión sobre el tema que quieras."
    />
    <meta
      name="description"
      content="Expresa libremente y sin ningún tipo de tapujos tu opinión sobre el tema que quieras."
    />
    <meta name="keywords" content="Foros, opinion, participa, grita" />
    <meta name="author" content="Nacho Carmona" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gritos.com" />
    <meta
      name="twitter:description"
      content="Expresa libremente y sin ningún tipo de tapujos tu opinión sobre el tema que quieras."
    />
    <meta
      name="twitter:image"
      content="https://gritos.com/assets/logogritos.jpg"
    />
    <meta
      name="google-site-verification"
      content="nhdMmpC7s40gPS_GMTE69340pG2sWpYlaKYBeT2f9UU"
    />

    <!-- Global <img onerror> fallback. Message bodies and the captured-URL
         card (util/displayCapturedUrl.html) call this inline, so it has to be
         a real global defined before any content renders. -->
    <script>
      window.imgError = function (img) {
        img.src = "/imagenes/vacio.gif";
      };
    </script>

    <!-- PWA / icons. Served from src/assets via Vite's publicDir, so these
         resolve at the root — which is also what manifest.json's own icon
         entries assume. -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png" />
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="/apple-icon-114x114.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/apple-icon-120x120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/apple-icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/apple-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-icon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-icon-192x192.png"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Material Icons font. The MDL *stylesheet* is not loaded here: main.less
         imports material.light_green-red.min.css locally, the same theme the
         deployed build ships. The CDN <link> that used to sit here pulled
         1.3.0 orange-indigo, so two MDL themes were loading at once. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
  </head>
  <body>
    <div id="react-root"></div>
    <noscript>
      <p>
        Hace falta Javascript para que funcione Gritos.com<br />Porfa, activalo
        o actualiza tu navegador o algo...
      </p>
    </noscript>
    <!-- Vite uses ESM modules directly -->
    <script type="module" src="/src/js/app/index.js"></script>
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  </body>
</html>
